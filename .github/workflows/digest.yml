name: news-digest

on:
  schedule:
    - cron: "0,5,10,15 23 * * *"
    - cron: "0,5,10,15 5 * * *"
    - cron: "0,5,10,15 11 * * *"
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Integrity check (fallback to last good main.py)
        run: |
          if python -m py_compile main.py; then
            cp main.py main_last_good.py
            echo "BROKEN_MAIN=0" >> $GITHUB_ENV
          elif [ -f main_last_good.py ]; then
            echo "::warning::main.py has a syntax error (truncated upload?) - running last good version"
            cp main_last_good.py main.py
            echo "BROKEN_MAIN=1" >> $GITHUB_ENV
          else
            echo "::error::main.py has a syntax error and no fallback exists"
            exit 1
          fi

      - name: Run digest
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TOKEN_SHORT:     ${{ secrets.TELEGRAM_TOKEN_SHORT }}
          TELEGRAM_CHAT_ID_MASTER:  ${{ secrets.TELEGRAM_CHAT_ID_MASTER }}
          TELEGRAM_CHAT_ID_NORMAL:  ${{ secrets.TELEGRAM_CHAT_ID_NORMAL }}
          TELEGRAM_CHAT_ID_SUB:     ${{ secrets.TELEGRAM_CHAT_ID_SUB }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID:          ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:      ${{ secrets.NAVER_CLIENT_SECRET }}
          SECRET_CONFIG:            ${{ secrets.SECRET_CONFIG }}
          HOLIDAY_KEY:              ${{ secrets.HOLIDAY_KEY }}
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git checkout -- main.py 2>/dev/null || true
          git add seen.json main_last_good.py 2>/dev/null || true
          git commit -m "update state [skip ci]" || echo "변경 없음"
          git pull --rebase --autostash origin main || true
          git push || true
